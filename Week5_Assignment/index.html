<!DOCTYPE html>
<html lang="en">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inline CSS</title>
        <link href="styles.css" rel="stylesheet">
    </head>
    <style>
        html {
            font-size: 20px;
            background-color: hsl(0, 84%, 83%);
        }
    </style>
    <body>
        <body style="background-color: rgb(255, 255, 255); color:black"></body>
        <h1 style="font-family: Arial, Helvetica, sans-serif; color: red;font-size: clamp(2rem, 5vw, 3.5rem)">Inline CSS</h1>
        <h2 style="border-bottom: 2px solid #333; color: rgba(46,155,87); background-color: rgb(0, 0, 0);">This is the heading of the Inline CSS</h2>
        <div style="background-color: #999999; padding: 2em; border-left: 5px solid rgb(28, 28, 29);">
            This is a paragraph of text that is styled using inline CSS.
        </div>
        <blockquote style="color: #000000; border-left: 5px solid #ccc; padding-left: 1em; background-color: rgb(240, 240, 240);">
            This is a blockquote that is styled using inline CSS.
    </body>

</html>
